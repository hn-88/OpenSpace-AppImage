name: Build and Push Docker Image (Ubuntu 26.04 GCC 15)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openspace-deps-ubuntu-2604-gcc15

jobs:
  build-and-push-ubuntu-2604:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 1. Checkout OpenSpace/docker for Dockerfile and data/build.sh
      - name: Checkout OpenSpace Docker Repo
        uses: actions/checkout@v4
        with:
          repository: 'OpenSpace/docker'
          path: openspace-docker

      # 2. Shallow checkout of OpenSpace to get vcpkg files and custom overlay ports
      - name: Checkout OpenSpace Manifest & Overlays
        uses: actions/checkout@v4
        with:
          repository: 'OpenSpace/OpenSpace'
          path: openspace-src
          sparse-checkout: |
            vcpkg.json
            vcpkg-configuration.json
            support/vcpkg
          sparse-checkout-cone-mode: false
          depth: 1

      # 3. Copy manifest, config, and support/vcpkg into the docker build context
      - name: Prepare vcpkg Context
        run: |
          mkdir -p openspace-docker/build/manifest/support/vcpkg
          cp openspace-src/vcpkg.json openspace-docker/build/manifest/
          
          # Copy vcpkg-configuration.json if it exists
          if [ -f openspace-src/vcpkg-configuration.json ]; then
            cp openspace-src/vcpkg-configuration.json openspace-docker/build/manifest/
          fi

          # Copy custom overlay ports
          if [ -d openspace-src/support/vcpkg ]; then
            cp -r openspace-src/support/vcpkg openspace-docker/build/manifest/support/
          fi

          echo "Files prepared in manifest directory:"
          ls -laR openspace-docker/build/manifest

      # 4. Inject vcpkg installation commands into Dockerfile
      - name: Inject vcpkg Dependency Installation into Dockerfile
        run: |
          cat << 'EOF' >> openspace-docker/build/ubuntu-2604-gcc15.Dockerfile

          # Copy entire manifest and overlay ports folder
          COPY manifest/ /vcpkg-manifest/

          # Install packages using the manifest and overlay ports
          RUN vcpkg install \
                --x-manifest-root=/vcpkg-manifest \
                --x-install-root=/vcpkg/installed \
                --clean-buildtrees-after-build \
                --clean-packages-after-build \
                --clean-downloads-after-build && \
              rm -rf /root/.cache/vcpkg && \
              rm -rf /vcpkg/buildtrees /vcpkg/downloads /vcpkg/packages

          # Point CMake to the installed packages
          ENV X_VCPKG_INSTALLED_DIR=/vcpkg/installed
          EOF

      - name: Inject System Qt into Dockerfile
        run: |
          echo "RUN apt-get update && apt-get install -y qt6-base-dev qt6-wayland libqt6opengl6-dev && rm -rf /var/lib/apt/lists/*" >> openspace-docker/build/ubuntu-2604-gcc15.Dockerfile
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format Lowercase Image Name
        id: image_tag
        run: |
          LOWER_IMAGE="${IMAGE_NAME,,}"
          echo "image=${REGISTRY}/${LOWER_IMAGE}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./openspace-docker/build
          file: ./openspace-docker/build/ubuntu-2604-gcc15.Dockerfile
          push: true
          tags: |
            ${{ steps.image_tag.outputs.image }}:latest
            ${{ steps.image_tag.outputs.image }}:ubuntu-2604-gcc15
            ${{ steps.image_tag.outputs.image }}:${{ github.sha }}
