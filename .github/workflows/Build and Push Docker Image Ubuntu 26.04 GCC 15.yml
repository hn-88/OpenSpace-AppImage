name: Build and Push Docker Image (Ubuntu 26.04 GCC 15)

on:
  workflow_dispatch:
  #schedule:
    # Rebuild weekly on Sundays at 00:00 UTC to catch upstream dependency updates
    #- cron: '0 0 * * 0'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openspace-deps-ubuntu-2604-gcc15

jobs:
  build-and-push-ubuntu-2604:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Verify Host Disk Space
        run: |
          echo "Disk space available for image build:"
          df -h /

      - name: Checkout OpenSpace Docker Repo
        uses: actions/checkout@v4
        with:
          repository: 'OpenSpace/docker'
          path: openspace-docker

      - name: Download Upstream vcpkg.json
        run: |
          curl -sSL -o openspace-docker/build/vcpkg.json \
            https://raw.githubusercontent.com/OpenSpace/OpenSpace/master/vcpkg.json

      - name: Inject vcpkg Dependency Installation into Dockerfile
        run: |
          # Append steps to build the dependencies and purge temporary compiler files in a single layer
          cat << 'EOF' >> openspace-docker/build/ubuntu-2604-gcc15.Dockerfile

          # -------------------------------------------------------------
          # Pre-compile OpenSpace dependencies using vcpkg
          # -------------------------------------------------------------
          COPY vcpkg.json /vcpkg-manifest/vcpkg.json

          # Install packages directly into /vcpkg/installed and discard intermediate build bloat
          RUN vcpkg install \
                --x-manifest-root=/vcpkg-manifest \
                --x-install-root=/vcpkg/installed \
                --clean-buildtrees-after-build \
                --clean-packages-after-build \
                --clean-downloads-after-build && \
              rm -rf /root/.cache/vcpkg && \
              rm -rf /vcpkg/buildtrees /vcpkg/downloads /vcpkg/packages

          # Instruct CMake in this image to use the pre-installed tree
          ENV X_VCPKG_INSTALLED_DIR=/vcpkg/installed
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format Lowercase Image Name
        id: image_tag
        run: |
          # ghcr.io strictly requires all-lowercase repository/image paths
          LOWER_IMAGE="${IMAGE_NAME,,}"
          echo "image=${REGISTRY}/${LOWER_IMAGE}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./openspace-docker/build
          file: ./openspace-docker/build/ubuntu-2604-gcc15.Dockerfile
          push: true
          tags: |
            ${{ steps.image_tag.outputs.image }}:latest
            ${{ steps.image_tag.outputs.image }}:ubuntu-26.04-gcc15
            ${{ steps.image_tag.outputs.image }}:${{ github.sha }}
