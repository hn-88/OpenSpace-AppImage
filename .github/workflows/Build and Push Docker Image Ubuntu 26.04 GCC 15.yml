name: Build and Push Docker Image (Ubuntu 26.04 GCC 15)

on:
  workflow_dispatch:
  #schedule:
    # Optional: rebuild weekly on Sunday at midnight to catch upstream updates
    #- cron: '0 0 * * 0'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Replace or use repository owner for standard ghcr.io namespace
  IMAGE_NAME: ${{ github.repository_owner }}/openspace-deps-ubuntu-2604-gcc15

jobs:
  build-and-push-ubuntu-2604:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Prepare Build Context and Download Upstream Files
        run: |
          mkdir -p docker-context
          cd docker-context

          echo "Downloading Dockerfile..."
          curl -sSL -o Dockerfile \
            https://raw.githubusercontent.com/OpenSpace/docker/master/build/ubuntu-2604-gcc15.Dockerfile

          echo "Downloading vcpkg.json..."
          curl -sSL -o vcpkg.json \
            https://raw.githubusercontent.com/OpenSpace/OpenSpace/master/vcpkg.json

          ls -la

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format Image Name
        id: image_tag
        run: |
          # ghcr.io strictly enforces lower-case repo names
          LOWER_IMAGE="${IMAGE_NAME,,}"
          echo "image=${REGISTRY}/${LOWER_IMAGE}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./docker-context
          file: ./docker-context/Dockerfile
          push: true
          tags: |
            ${{ steps.image_tag.outputs.image }}:latest
            ${{ steps.image_tag.outputs.image }}:ubuntu-26.04-gcc15
            ${{ steps.image_tag.outputs.image }}:${{ github.sha }}
