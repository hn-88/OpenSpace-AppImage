name: vcpkg-windows-deps-cache

on:
  workflow_dispatch:      # run manually whenever vcpkg.json's base dependencies change

env:
  # Check support/vcpkg/triplets/ in the repo first — OpenSpace ships its own
  # overlay triplets, one of them may already be the intended Windows triplet.
  VCPKG_TRIPLET: x64-windows-static-md
  VCPKG_ROOT: C:/vcpkg-pinned          # NOT C:/vcpkg (preinstalled on the runner)
  VCPKG_INSTALLED: C:/vcpkg_installed  # separate from vcpkg's classic tree
  openSpaceHome: ${{ github.workspace }}/source/OpenSpace

jobs:
  build-deps-cache:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v6      # needed so gh release calls have a git repo to work in

    - name: Get OpenSpace source
      run: |
        git clone https://github.com/OpenSpace/OpenSpace $env:openSpaceHome
        cd $env:openSpaceHome
        git checkout "master"

    - name: Bootstrap vcpkg (pinned to manifest baseline)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $m = Get-Content "$env:openSpaceHome/vcpkg.json" -Raw | ConvertFrom-Json
        $commit = $m.'vcpkg-configuration'.'default-registry'.baseline
        if (-not $commit) { throw "No baseline found in vcpkg.json" }
        git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
        git -C $env:VCPKG_ROOT checkout $commit
        & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
        

    - name: Install CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '4.3.3'

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9.*'          # set to the version OpenSpace expects
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        cache: true

    - name: Configure (this runs the vcpkg manifest install)
      run: |
        cmake -S $env:openSpaceHome -B "$env:openSpaceHome/build" `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
          -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLED" `
          -DCMAKE_BUILD_TYPE="RelWithDebInfo" -DASSIMP_BUILD_MINIZIP=1 `
          -DBUILD_TESTS=OFF -DOPENSPACE_HAVE_TESTS=OFF -DSGCT_BUILD_TESTS=OFF `
          -DOPENSPACE_USE_SYSTEM_QT=ON `
          -DGHOUL_HIGH_DEBUG_MODE=OFF -DGHOUL_HAVE_TESTS=OFF `
          -DOPENSPACE_ENABLE_ALL_MODULES=ON

    - name: Verify a known header exists
      run: |
        $probe = "$env:VCPKG_INSTALLED/$env:VCPKG_TRIPLET/include/curl/curl.h"
        if (-not (Test-Path $probe)) {
          Write-Error "Expected header not found at $probe — deps install may have failed."
          exit 1
        }

    - name: Zip installed vcpkg packages (deps only), split into <2GB volumes
      shell: pwsh
      run: |
        $src = "$env:VCPKG_INSTALLED"
        Write-Host "Zipping from: $src"
        # -v1900m splits into ~1.9 GiB volumes (GitHub's release asset limit is 2 GiB exactly)
        # producing vcpkg-windows-deps.zip.001, .002, ... — matches the qt-cache
        # workflow's restore step, which expects this naming pattern.
        7z a -tzip -mx=5 -v1900m vcpkg-windows-deps.zip "$src\*"

    - name: Upload volumes to GitHub Release
      shell: pwsh
      run: |
        $RELEASE_TAG = "vcpkg-windows-deps-cache"
        gh release view $RELEASE_TAG > $null 2>&1
        if ($LASTEXITCODE -ne 0) {
          gh release create $RELEASE_TAG `
            -t "vcpkg Windows deps cache (non-Qt)" `
            -n "Pre-built vcpkg packages for $env:VCPKG_TRIPLET, excluding Qt (OpenSpace master)."
        }
        $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss")
        gh release edit $RELEASE_TAG `
          -t "vcpkg Windows deps cache (non-Qt)" `
          -n "Pre-built vcpkg packages for $env:VCPKG_TRIPLET, excluding Qt (OpenSpace master). Updated $timestamp UTC."

        $volumes = Get-ChildItem -Path . -Filter "vcpkg-windows-deps.zip.*"
        if ($volumes.Count -eq 0) {
          Write-Error "No volume files found to upload (expected vcpkg-windows-deps.zip.001 etc.)"
          exit 1
        }
        foreach ($v in $volumes) {
          Write-Host "Uploading $($v.Name) ..."
          gh release upload $RELEASE_TAG $v.FullName --clobber
        }
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}
