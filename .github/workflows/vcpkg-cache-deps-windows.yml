name: vcpkg-windows-deps-cache

on:
  workflow_dispatch:      # run manually whenever vcpkg.json's base dependencies change

env:
  # Check support/vcpkg/triplets/ in the repo first — OpenSpace ships its own
  # overlay triplets, one of them may already be the intended Windows triplet.
  VCPKG_TRIPLET: x64-windows-static-md
  VCPKG_INSTALLATION_ROOT: C:/vcpkg
  openSpaceHome: ${{ github.workspace }}/source/OpenSpace

jobs:
  build-deps-cache:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v6 
    # required for gh release edit and create
    
    - name: Get OpenSpace source (recursive — overlay ports live in submodules)
      run: |
        git clone --recursive https://github.com/OpenSpace/OpenSpace $env:openSpaceHome
        cd $env:openSpaceHome
        git checkout "master" --recurse-submodules

    - name: Bootstrap vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg $env:VCPKG_INSTALLATION_ROOT
        & "$env:VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.bat" -disableMetrics
        echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        echo "$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_PATH

    - name: Install base (non-Qt) dependencies
      # "qt" is an opt-in feature in OpenSpace's vcpkg.json — a plain install
      # (no --x-feature) already installs everything except Qt.
      run: |
        & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install `
          --triplet $env:VCPKG_TRIPLET `
          --x-manifest-root="$env:openSpaceHome" `
          --x-install-root="$env:VCPKG_INSTALLATION_ROOT/installed"

    - name: Verify a known header exists
      run: |
        $probe = "$env:VCPKG_INSTALLATION_ROOT/installed/$env:VCPKG_TRIPLET/include/curl/curl.h"
        if (-not (Test-Path $probe)) {
          Write-Error "Expected header not found at $probe — deps install may have failed."
          exit 1
        }

    - name: Zip installed vcpkg packages (deps only)
      shell: pwsh
      run: |
        $src = "$env:VCPKG_INSTALLATION_ROOT\installed"
        Write-Host "Zipping from: $src"
        7z a -tzip -mx=5 vcpkg-windows-deps.zip "$src\*"

    - name: Upload to GitHub Release
      shell: pwsh
      run: |
        $RELEASE_TAG = "vcpkg-windows-deps-cache"
        $ZIP_FILE    = "vcpkg-windows-deps.zip"
        gh release view $RELEASE_TAG > $null 2>&1
        if ($LASTEXITCODE -ne 0) {
          gh release create $RELEASE_TAG `
            -t "vcpkg Windows deps cache (non-Qt)" `
            -n "Pre-built vcpkg packages for $env:VCPKG_TRIPLET, excluding Qt (OpenSpace master)."
        }
        $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss")
        gh release edit $RELEASE_TAG `
          -t "vcpkg Windows deps cache (non-Qt)" `
          -n "Pre-built vcpkg packages for $env:VCPKG_TRIPLET, excluding Qt (OpenSpace master). Updated $timestamp UTC."
        gh release upload $RELEASE_TAG $ZIP_FILE --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}
